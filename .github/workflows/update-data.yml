name: Update CVM data

on:
  schedule:
    # 11th, 12th and 14th of each month at 12:00 UTC = 04:00 PST, catching
    # filings as they trickle in. Companies have until the 10th to file
    # their Art. 11 disclosures and CVM's bulk export trails delivery by
    # ~2 days, so coverage of the month just closed runs roughly 55% on the
    # 11th, ~95% on the 12th (the deadline-day batch lands here) and ~96%
    # on the 14th. GitHub cron is UTC-only and does not follow DST, so
    # these fire at 05:00 Pacific under PDT.
    - cron: "0 12 11,12,14 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json data/meta.json data/by_company data/monthly.json data/bb_monthly.json
          git diff --cached --quiet || git commit -m "Update CVM data"
          git push
