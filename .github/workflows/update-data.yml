name: Update CVM data

on:
  schedule:
    # 11th of each month at 12:00 UTC = 04:00 PST. Companies have until the
    # 10th to file their Art. 11 disclosures, so this runs once a month's
    # filing window has closed rather than while it is still open (see
    # partial_tail_months in scripts/ingest.py). GitHub cron is UTC-only and
    # does not follow DST, so this lands at 05:00 Pacific under PDT.
    - cron: "0 12 11 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json data/meta.json data/by_company data/monthly.json data/bb_monthly.json
          git diff --cached --quiet || git commit -m "Update CVM data"
          git push
