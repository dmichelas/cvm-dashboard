name: Update CVM data

on:
  schedule:
    # 11th and 14th of each month at 12:00 UTC = 04:00 PST. Companies have
    # until the 10th to file their Art. 11 disclosures. Data now comes from
    # CVM's live search in real time (see refresh_from_live_search), not the
    # bulk export that used to trail delivery by ~2 days -- so the day after
    # the deadline already reflects ~everything filed, and the old third pull
    # existed only to wait out that export lag, which is gone.
    #   * 11th: first read once the filing window has closed (~95%+).
    #   * 14th: picks up the late-filing / amendment tail, and is the
    #     insurance pull if the 11th run fails (there is no auto-retry) or the
    #     10th fell on a weekend and filings slipped to the following week.
    # GitHub cron is UTC-only and ignores DST, so these fire at 05:00 Pacific
    # under PDT.
    - cron: "0 12 11,14 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/ingest.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json data/meta.json data/by_company data/monthly.json data/bb_monthly.json
          git diff --cached --quiet || git commit -m "Update CVM data"
          git push
